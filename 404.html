<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0B1420">
  <title>Страница не найдена — CloudPath</title>
  <link rel="icon" href="/cloudpath-icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    :root{color-scheme:dark;--bg:#0B1420;--panel:#111D2C;--line:#223349;--text:#E7ECF2;--muted:#7E92A8;--accent:#4FD8C4;--violet:#8B7CF6}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 20%,#17273b,var(--bg) 55%);color:var(--text);font:16px/1.55 system-ui,sans-serif}.card{max-width:620px;padding:42px;border:1px solid var(--line);border-radius:20px;background:rgba(17,29,44,.9);box-shadow:0 24px 70px rgba(0,0,0,.3)}.code{color:var(--accent);font:700 13px ui-monospace,monospace;letter-spacing:.12em}h1{font-size:clamp(30px,7vw,54px);line-height:1.05;margin:12px 0}p{color:var(--muted);margin:0 0 26px}a{display:inline-block;padding:11px 16px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--violet));color:#07131e;font-weight:750;text-decoration:none}a:focus-visible{outline:3px solid #F2B84B;outline-offset:4px}
  </style>
</head>
<body><main class="card"><div class="code">ERROR · 404</div><h1>Путь потерялся в облаке</h1><p>Такой страницы нет или её адрес изменился. Вернитесь к дорожной карте и продолжите с нужного раздела.</p><a href="/">Вернуться на главную</a></main></body>
</html>
